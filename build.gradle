plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'java'
}

group = 'com.gregtechbook'
version = '0.1.0'
archivesBaseName = 'gregtech-book-neoforge'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net' }
}

dependencies {
    // NeoForge / Forge 1.20.1 - exact mappings to be set by developer environment
    minecraft 'net.minecraftforge:forge:1.20.1-46.1.0'
    // Optional dependency on FTB Quests (soft dependency configured in mods.toml)
    // Implementation/classpath-only dependency for compile-time integration
    compileOnly 'com.feed_the_beast:ftb-quests:1600.0'
}

jar {
    manifest {
        attributes(
            'Specification-Title': project.name,
            'Specification-Vendor': '018632-oss',
            'Specification-Version': project.version
        )
    }
}
